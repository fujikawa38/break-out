<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>ユーザー登録</title>
	<link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
	<div class="container">
		<h1>新規ユーザー登録</h1>
		<div th:if="${error}" class="error">
			<p th:text="${error}"></p>
		</div>
		<form th:action="@{/register}" method="post" th:object="${form}">
			<div th:if="${#fields.hasErrors('username')}" class="error">
				<p th:errors="*{username}"></p>
			</div>
			<label>ユーザー名：<input type="text" th:field="*{username}"></label><br>
		
			<div th:if="${#fields.hasErrors('password')}" class="error">
				<p th:errors="*{password}"></p>
			</div>
			<label>パスワード：<input type="password" th:field="*{password}"></label><br>
		
			<div th:if="${#fields.hasErrors('confirmPassword')}" class="error">
				<p th:errors="*{confirmPassword}"></p>
			</div>
			<label>確認用パスワード：<input type="password" th:field="*{confirmPassword}"></label><br>
			<button type="submit">登録</button>
		</form>
	
		<p>ログイン画面に<a th:href="@{/login}">もどる</a></p>
	</div>
</body>
</html>
