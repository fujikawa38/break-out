<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="_csrf" th:content="${_csrf.token}">
	<meta name="_csrf_header" th:content="${_csrf.headerName}">
	<link rel="stylesheet" th:href="@{/css/style.css}">
	<title>ブロック崩し</title>
</head>
<body>
	<div class="main_container">
		<h1>ブロック崩し タイムアタック</h1>
		
		<div th:if="${principal != null}" class="user_info">
			<p>こんにちは、<span th:text="${principal.name}"></span>さん</p>
			<div th:if="${bestScore != null}">
				<p>あなたのベストタイム：<span th:text="${#numbers.formatDecimal(bestScore.time / 1000, 1, 2)}"></span>秒</p>
			</div>
			<div th:if="${bestScore == null}">
				<p>まだスコアがありません</p>
			</div>
		</div>
	
		<canvas id="gameCanvas" width="600" height="500"></canvas>
		
		<div class="item_legend">
			<h3>アイテム</h3>
			<div class="item_legend_item">
				<div class="item_legend_color item_speed_up"></div>
				<span>スピードアップ</span>
			</div>
			<div class="item_legend_item">
				<div class="item_legend_color item_paddle_sizeup"></div>
				<span>パドルサイズアップ</span>
			</div>
			<div class="item_legend_item">
				<div class="item_legend_color item_pierce"></div>
				<span>ブロック貫通（一度のみ）</span>
			</div>
		</div>
	
		<form th:action="@{/logout}" method="post" class="logout_form">
			<button type="submit">ログアウト</button>
		</form>
	</div>

	<div class="ranking_container">
		<h2>ランキング</h2>
		<table class="ranking_table">
			<thead>
				<tr>
					<th>順位</th>
					<th>ユーザー名</th>
					<th>タイム</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="score, stat : ${topScores}">
					<td th:text="${stat.index + 1}"></td>
					<td th:text="${score.user.username}"></td>
					<td th:text="${#numbers.formatDecimal(score.time / 1000, 1, 2)} + '秒'"></td>
				</tr>
			</tbody>
		</table>
	</div>
	
	<script src="/js/game.js"></script>
</body>
</html>
